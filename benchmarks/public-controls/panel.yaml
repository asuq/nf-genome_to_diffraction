workflow_suite: homomer_workflow_cases.yaml
selection_policy:
  - Use only public X-ray entries with deposited structure factors and a frozen catalogue mapping.
  - Cover diverse prokaryotes without treating multiple crystal forms of one protein as independent targets.
  - Span full-length proteins, affinity-tagged constructs, precursor-cleaved domains, and ASU copy counts from one to six.
  - Keep heteromeric pMMO as an explicit assumption-violation control outside the ASU=nA positive set.
