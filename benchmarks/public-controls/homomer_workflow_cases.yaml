schema_version: "1.0"
suite_id: prokaryote_homomer_workflow_v1
panel_id: prokaryote_public_xray_v2
frozen_at: 2026-08-16T00:00:00Z
interpretation_policy:
  - Positive cases require retention of the truth-labelled catalogue sequence and known ASU copy count; top-one identity is not required.
  - A wrong-model negative may remain inspectable or even cross the provisional score annotation, but it must not displace the matched positive ground truth.
  - Target-absent and wrong-catalogue controls must never convert an external coordinate hit into a reportable identity.
  - The known heteromer is an abstention control for ASU=nA, not a heteromer-reconstruction target.
  - This operational suite includes public exact structures and must not be reported as leakage-controlled generalisation evidence.
