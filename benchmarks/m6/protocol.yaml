interpretation_policy:
  - Retain every candidate and every parent-child attempt.
  - LLG and TFZ are ranking annotations only and never candidate-deletion gates.
  - Exact target coordinates are excluded from both positive tracks; all model routes receive the leakage policy in the leakage-controlled track.
  - Truth is inaccessible to the runner and joined only after collected result checksums are fixed.
  - These are internal engineering thresholds and do not establish population-level sensitivity, specificity, or generalisation.
