[workspace]
name = "nf-genome_to_diffraction"
version = "0.1.0"
description = "Foundation for genome-to-diffraction protein candidate identification"
authors = ["Akito Shima"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.76.2,<0.77.0"
license = "BSD-3-Clause"
license-file = "LICENSE"
readme = "README.md"
channel-priority = "strict"

[dependencies]
python = "==3.14.6"
python-gil = "==3.14.6"
nextflow = "==26.04.6"
openjdk = "21.*"
jsonschema = ">=4.25,<5"
pyyaml = ">=6.0,<7"
pydantic = ">=2.11,<3"
tqdm = ">=4.67,<5"
biopython = ">=1.85,<2"
gemmi = ">=0.7.3,<0.8"
numpy = ">=2.3,<3"
polars = ">=1.32,<2"

[pypi-dependencies]
nf-genome-to-diffraction = { path = ".", editable = true }
rfc8785 = ">=0.1,<1"

[feature.dev.dependencies]
pytest = ">=8.4,<9"
ruff = ">=0.12,<1"
ty = ">=0.0.54,<0.1"
actionlint = ">=1.7,<2"

[feature.dev.pypi-dependencies]
types-jsonschema = ">=4.25,<5"
types-pyyaml = ">=6.0,<7"
types-tqdm = ">=4.67,<5"

[feature.hpc]
platforms = ["linux-64"]

[feature.hpc.dependencies]
bash = ">=5,<6"
foldseek = "==10.941cd33"
mmseqs2 = "==18.8cc5c"

[environments]
default = ["dev"]
dev = ["dev"]
hpc = ["dev", "hpc"]

[tasks]
format = "ruff format src tests"
format-check = "ruff format --check src tests"
lint = "ruff check src tests"
typecheck = "ty check"
test-unit = "pytest --basetemp=/tmp/nf-gtd-pytest-unit -q tests/unit"
test-contract = "pytest --basetemp=/tmp/nf-gtd-pytest-contract -q tests/contract"
test-integration = "pytest --basetemp=/tmp/nf-gtd-pytest-integration -q tests/integration"
test = { depends-on = ["test-unit", "test-contract", "test-integration"] }
schema-check = "genome-to-diffraction schema-check"
docs-check = "python tests/scripts/check_docs.py"
actionlint-check = "actionlint .github/workflows/ci.yml"
nextflow-check = "python tests/scripts/check_nextflow.py --syntax"
nextflow-stub = "python tests/scripts/check_nextflow.py --stub"
hpc-wrapper-check = "bash -n bootstrap/nf-gtd-hpc-remote bootstrap/nf-gtd-hpc-smoke-job bootstrap/nf-gtd-hpc-recover-tools"
build-hpc-test = "python bootstrap/build_hpc_test_app.py --output dist/nf-gtd-hpc-test"
prepare-project-layout = "bootstrap/prepare_project_layout.sh"
prepare-public-control = "genome-to-diffraction benchmark prepare-public-control --specification benchmarks/public-controls/pdb_8oox.yaml"
public-panel-check = "genome-to-diffraction benchmark check-public-panel --panel benchmarks/public-controls/panel.yaml"
prepare-public-panel = "genome-to-diffraction benchmark prepare-public-panel --panel benchmarks/public-controls/panel.yaml --outdir .untracked/public-controls/panel-v2"
check = { depends-on = ["format-check", "lint", "typecheck", "test", "schema-check", "public-panel-check", "docs-check", "actionlint-check", "nextflow-check", "nextflow-stub", "hpc-wrapper-check"] }
